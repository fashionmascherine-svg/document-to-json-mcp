# Smithery.ai configuration
# https://smithery.ai/docs/build
name: document-to-json-mcp
description: Convert PDFs to structured JSON. Extract invoices, bank statements, contracts, and more. Pay per call via x402 USDC on Base.
runtime: python
entrypoint: .venv/bin/python -m src.server
pricing: x402
config:
  python:
    version: "3.11"
  buildCommand: uv venv && uv pip install -r requirements.txt
  startCommand: .venv/bin/python -m src.server
env:
  DEEPSEEK_API_KEY:
    description: API key for DeepSeek API
    required: true
    secret: true
  X402_WALLET_ADDRESS:
    description: Your USDC wallet address on Base network for receiving payments
    required: false
  X402_NETWORK:
    description: "Base network (eip155:8453 for mainnet, eip155:84532 for sepolia testnet)"
    required: false
    default: eip155:8453
